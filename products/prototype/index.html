<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>mitooshi v3.0 プロトタイプ</title>
<style>
  :root {
    --primary: #00B894;
    --primary-hover: #009b7c;
    --primary-soft: #e6f7f3;
    --link: #0073cc;
    --accent-pink: #FFB6B6;
    --star-yellow: #FFD166;
    --star-yellow-border: #E8B800;
    --text: #333333;
    --text-sub: #666666;
    --text-muted: #999999;
    --bg: #ffffff;
    --bg-soft: #f6f6f6;
    --border: #e5e5e5;
    --border-strong: #d0d0d0;
    --danger: #e74c3c;
    --confetti-1: #00B894;
    --confetti-2: #FFB6B6;
    --confetti-3: #0073cc;
    --confetti-4: #FFE7A0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    color: var(--text);
    background: #e8ebf0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }

  /* ============ Phone frame ============ */
  .phone {
    width: 375px;
    height: 812px;
    max-height: calc(100vh - 48px);
    background: #fff;
    border-radius: 40px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 16px 48px rgba(0,0,0,0.18), 0 0 0 10px #1a1a1a;
  }
  @media (max-width: 420px), (max-height: 860px) {
    body { padding: 0; background: #fff; }
    .phone {
      width: 100vw; height: 100vh; max-height: 100vh;
      border-radius: 0; box-shadow: none;
    }
  }
  .notch {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 110px; height: 22px;
    background: #1a1a1a;
    border-bottom-left-radius: 12px;
    border-bottom-right-radius: 12px;
    z-index: 100;
  }
  @media (max-width: 420px), (max-height: 860px) {
    .notch { display: none; }
  }

  .phone-inner {
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    background: #fff;
  }

  /* ============ Status bar (Apple HIG風・リアル調) ============ */
  .status-bar {
    height: 36px;
    padding: 10px 22px 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
    color: var(--text);
  }
  .status-bar .time {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }
  .status-bar .indicators {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
  }
  .status-bar .signal,
  .status-bar .wifi,
  .status-bar .battery {
    display: inline-block;
  }
  .status-bar .battery {
    width: 24px; height: 11px;
    border: 1.2px solid var(--text);
    border-radius: 3px;
    position: relative;
  }
  .status-bar .battery::after {
    content: '';
    position: absolute;
    top: 2px; left: 1px;
    width: 18px; height: 5px;
    background: var(--text);
    border-radius: 1px;
  }
  .status-bar .battery::before {
    content: '';
    position: absolute;
    top: 3px; right: -3px;
    width: 2px; height: 3px;
    background: var(--text);
    border-radius: 0 1px 1px 0;
  }

  /* ============ Large Title (Apple HIG準拠) ============ */
  .large-title {
    padding: 8px 20px 16px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    background: #fff;
  }
  .large-title .brand {
    font-size: 34px;
    font-weight: 900;
    color: var(--primary);
    letter-spacing: -0.5px;
    line-height: 1.1;
    font-family: "Helvetica Neue", "SF Pro Display", -apple-system, system-ui, sans-serif;
  }
  .large-title .subtitle {
    font-size: 13px;
    color: var(--text-sub);
    margin-top: 2px;
    font-weight: 500;
  }
  .large-title.no-border {
    border-bottom: none;
  }

  /* ============ Screen container ============ */
  .screen-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }
  .screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    background: #fff;
  }
  .screen.active {
    display: flex;
  }

  /* ============ Header ============ */
  .header {
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    min-height: 48px;
  }
  .back-btn {
    min-width: 44px; min-height: 44px;
    border: none;
    background: transparent;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: var(--primary);
    flex-shrink: 0;
    cursor: pointer;
    transition: background 120ms, transform 80ms;
    margin-left: -10px;
    padding: 6px 10px;
    gap: 2px;
    font-size: 15px;
    font-weight: 600;
    user-select: none;
    -webkit-user-select: none;
  }
  .back-btn:active {
    background: rgba(0,184,148,0.08);
    transform: scale(0.96);
  }
  .back-btn .icon {
    stroke: var(--primary);
    stroke-width: 2.2;
    width: 18px; height: 18px;
    pointer-events: none;
  }
  .back-btn .back-label {
    pointer-events: none;
    color: var(--primary);
  }
  .header .title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    flex: 1;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 4px;
  }
  .header .title-spacer { min-width: 72px; flex-shrink: 0; }

  /* ============ Body ============ */
  .body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    -webkit-overflow-scrolling: touch;
  }
  .body.no-padding { padding: 0; }

  /* ============ SVG icons ============ */
  .icon {
    width: 20px; height: 20px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }
  .icon.sm { width: 16px; height: 16px; stroke-width: 2; }
  .icon.lg { width: 28px; height: 28px; }
  .icon.xl { width: 40px; height: 40px; }
  .icon.tabbar { width: 24px; height: 24px; stroke-width: 1.7; }
  .icon.fab { width: 28px; height: 28px; stroke-width: 2.4; stroke: #fff; }

  /* ============ S1: TOP list ============ */
  .section-label {
    font-size: 12px;
    color: var(--text-sub);
    font-weight: 600;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  .list-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 14px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: background 120ms, transform 120ms;
    user-select: none;
    -webkit-user-select: none;
  }
  .list-row:active {
    background: var(--bg-soft);
    transform: scale(0.99);
  }
  .list-row.long-press {
    background: var(--primary-soft);
    transform: scale(0.98);
  }
  .list-row .star-btn {
    width: 40px; height: 40px;
    padding: 0;
    margin: -6px -4px -6px -8px;
    border: none;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
    border-radius: 20px;
    transition: background 120ms, transform 120ms;
    -webkit-tap-highlight-color: transparent;
  }
  .list-row .star-btn:active {
    background: rgba(255,209,102,0.18);
    transform: scale(0.9);
  }
  .list-row .star-btn.pulse {
    animation: star-pulse 240ms ease-out;
  }
  @keyframes star-pulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.4); }
    100% { transform: scale(1); }
  }
  .list-row .star-btn .icon {
    width: 22px; height: 22px;
    stroke: #bbb;
    fill: none;
    stroke-width: 1.8;
    pointer-events: none;
    transition: stroke 160ms, fill 160ms;
  }
  .list-row .star-btn.active .icon {
    fill: var(--star-yellow);
    stroke: var(--star-yellow-border);
    stroke-width: 1.6;
  }
  .list-row .name {
    flex: 1;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }
  .list-row .edit-btn {
    width: 36px; height: 36px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-sub);
    flex-shrink: 0;
    cursor: pointer;
    padding: 0;
    margin-right: 2px;
    transition: background 120ms, transform 120ms, border-color 120ms;
    -webkit-tap-highlight-color: transparent;
  }
  .list-row .edit-btn:active {
    background: var(--primary-soft);
    border-color: var(--primary);
    transform: scale(0.92);
  }
  .list-row .edit-btn .icon {
    stroke: var(--text-sub);
    width: 16px; height: 16px;
    pointer-events: none;
  }
  .list-row .edit-btn:active .icon { stroke: var(--primary); }
  .list-row .chev {
    color: var(--primary);
    stroke: var(--primary);
    width: 14px; height: 14px;
  }
  .divider-line {
    border-top: 1px solid var(--border);
    margin: 16px 0;
  }

  .empty-hint {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    padding: 24px 16px;
  }

  /* ============ Tab bar ============ */
  .tabbar {
    height: 76px;
    border-top: 1px solid var(--border);
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding-bottom: 8px;
    flex-shrink: 0;
    z-index: 5;
  }
  .tabbar.hidden { display: none; }
  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--text-sub);
    cursor: pointer;
    padding: 6px 12px;
    flex: 1;
    transition: color 120ms;
  }
  .tab.active {
    color: var(--primary);
    font-weight: 700;
  }
  .tab.active .icon { stroke: var(--primary); }
  .tab.center { position: relative; margin-top: -22px; }
  .tab.center .fab {
    width: 52px; height: 52px;
    background: var(--primary);
    border-radius: 26px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(0,184,148,0.35);
    margin-bottom: 2px;
    transition: transform 120ms, box-shadow 120ms, background 160ms;
  }
  .tab.center .fab:active {
    transform: scale(0.94);
    box-shadow: 0 2px 6px rgba(0,184,148,0.5);
  }
  /* 中央FABの＋アイコンは常に白（active時に親tab色に飲まれないように優先度を上げる） */
  .tab.center .fab .icon,
  .tab.center.active .fab .icon {
    stroke: #fff !important;
    width: 28px; height: 28px;
    stroke-width: 2.6;
  }
  /* active時のFABをわずかに濃く */
  .tab.center.active .fab {
    background: var(--primary-hover);
    box-shadow: 0 6px 16px rgba(0,184,148,0.5);
  }

  /* ============ CTA ============ */
  .cta-area {
    padding: 14px 16px 22px;
    border-top: 1px solid var(--border);
    background: #fff;
    flex-shrink: 0;
  }
  .cta {
    width: 100%;
    padding: 16px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 120ms, transform 120ms;
  }
  .cta:active:not(.disabled) { background: var(--primary-hover); transform: scale(0.98); }
  .cta.disabled { background: #ccc; cursor: not-allowed; }
  .cta .icon { stroke: #fff; width: 14px; height: 14px; stroke-width: 2.5; }

  /* ============ S2: Title input ============ */
  .input-wrap { padding: 60px 20px 20px; }
  .input-label {
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 8px;
  }
  .input-field {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 14px;
    font-size: 14px;
    color: var(--text);
    outline: none;
    font-family: inherit;
    transition: border-color 120ms;
  }
  .input-field:focus {
    border-color: var(--primary);
  }

  /* ============ S3: Category buttons ============ */
  .cat-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 14px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background 120ms, transform 120ms;
    user-select: none;
  }
  .cat-btn:active { background: var(--bg-soft); transform: scale(0.99); }
  .cat-btn .icon-wrap {
    width: 40px; height: 40px;
    border-radius: 8px;
    background: var(--primary-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .cat-btn .icon-wrap .icon { stroke: var(--primary); width: 22px; height: 22px; }
  .cat-btn .text { flex: 1; font-size: 15px; font-weight: 600; color: var(--text); }
  .cat-btn .chev { color: var(--primary); stroke: var(--primary); width: 14px; height: 14px; }

  /* ============ S4a: illust tabs + grid ============ */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 10px 10px 6px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tab-chip {
    font-size: 11px;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 4px;
    background: var(--bg-soft);
    color: var(--text-sub);
    border: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  .tab-chip.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .illust-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    padding: 12px;
  }
  .illust-cell {
    aspect-ratio: 1 / 1.15;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6px 4px;
    font-size: 11px;
    color: var(--text-sub);
    cursor: pointer;
    transition: background 120ms, transform 120ms, border-color 120ms;
    overflow: hidden;
  }
  .illust-cell:active {
    background: var(--primary-soft);
    transform: scale(0.96);
    border-color: var(--primary);
  }
  .illust-cell .cell-img {
    flex: 1;
    width: 100%;
    background: var(--bg-soft);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 4px;
  }
  .illust-cell .cell-img img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .illust-cell .cell-label {
    font-weight: 700;
    color: var(--text);
    font-size: 11px;
  }

  /* ============ S4b: photo ============ */
  .photo-slot {
    width: 180px; height: 180px;
    background: var(--bg-soft);
    border: 2px dashed var(--border-strong);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--text-sub);
    text-align: center;
    margin: 28px auto 18px;
    padding: 10px;
    overflow: hidden;
  }
  .photo-slot img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .photo-btn {
    width: 80%; max-width: 240px;
    padding: 12px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 0 auto 20px;
    color: var(--text);
    cursor: pointer;
    font-weight: 600;
    user-select: none;
  }
  .photo-btn:active { background: var(--bg-soft); }
  .photo-btn .icon { stroke: var(--text-sub); width: 16px; height: 16px; }

  /* ============ S4c: clock ============ */
  .clock-dropdowns {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 20px 0;
  }
  .dropdown {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    min-width: 70px;
    text-align: center;
    outline: none;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  .clock-face {
    width: 140px; height: 140px;
    border: 3px solid var(--text);
    border-radius: 50%;
    margin: 8px auto 16px;
    position: relative;
    background: #fff;
  }
  .clock-face .hand-h,
  .clock-face .hand-m {
    position: absolute;
    left: 50%;
    top: 50%;
    background: var(--text);
    border-radius: 2px;
    transform-origin: 50% 100%;
  }
  .clock-face .hand-h {
    width: 4px;
    height: 38px;
    margin-left: -2px;
    margin-top: -38px;
  }
  .clock-face .hand-m {
    width: 3px;
    height: 52px;
    margin-left: -1.5px;
    margin-top: -52px;
  }
  .clock-face .hub {
    position: absolute;
    top: 50%; left: 50%;
    width: 8px; height: 8px;
    background: var(--text);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
  }

  /* ============ S5: edit rows ============ */
  .edit-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 14px;
    min-height: 68px;
    background: var(--bg-soft);
    border-radius: 12px;
    margin-bottom: 10px;
    font-size: 14px;
    user-select: none;
  }
  .edit-row.removing {
    opacity: 0;
    transform: translateX(-40px);
    transition: opacity 280ms ease-out, transform 280ms ease-out;
  }
  .edit-row .trash {
    background: var(--danger);
    color: #fff;
    width: 40px; height: 40px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
    transition: transform 120ms;
  }
  .edit-row .trash:active { transform: scale(0.9); }
  .edit-row .trash .icon { stroke: #fff; width: 18px; height: 18px; stroke-width: 2.2; }
  .edit-row .thumb {
    width: 52px; height: 52px;
    background: #fff;
    border-radius: 6px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }
  .edit-row .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .edit-row .thumb.text-only .icon { stroke: var(--text-sub); width: 22px; height: 22px; }
  .edit-row .thumb.clock {
    font-size: 14px; font-weight: 800;
    background: #fff; color: var(--text);
    line-height: 1;
    letter-spacing: 0.5px;
  }
  .edit-row .name {
    flex: 1;
    font-size: 15px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 700;
  }
  .edit-row .edit-icon,
  .edit-row .handle {
    width: 36px; height: 36px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-sub);
    flex-shrink: 0;
    cursor: pointer;
  }
  .edit-row .edit-icon:active,
  .edit-row .handle:active { background: var(--bg-soft); }
  .edit-row .edit-icon .icon,
  .edit-row .handle .icon { stroke: var(--text-sub); width: 18px; height: 18px; }

  .edit-footer {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px 20px;
    border-top: 1px solid var(--border);
    background: #fff;
    flex-shrink: 0;
  }
  .fab-plus {
    width: 48px; height: 48px;
    background: var(--primary);
    color: #fff;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
    transition: transform 120ms;
    box-shadow: 0 3px 8px rgba(0,184,148,0.35);
  }
  .fab-plus:active { transform: scale(0.94); }
  .fab-plus .icon { stroke: #fff; width: 22px; height: 22px; stroke-width: 2.5; }
  .save-cta {
    flex: 1;
    padding: 14px;
    background: var(--primary);
    color: #fff;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: background 120ms, transform 120ms;
  }

<script>
/* ============================================================
   mitooshi v3.0 Prototype
   PRD: pdm/PRD_v3_MVP.md
   ============================================================ */

const ILLUST_BASE = '../../shared/illust/mitooshi/';

// ------------------ Preset illustration card library ------------------
// { id: { label, file, category } }
const ILLUST_LIBRARY = {

// ------------------ Preset scenes ------------------
function presetScene(id, name, illustIds, isFavorite = false) {
  const cards = illustIds.map((illustId, i) => {
    const spec = ILLUST_LIBRARY[illustId];
    return {
      id: `${id}_card_${i}`,
      type: 'illust',
      label: spec.label,
      illustFile: spec.file,
    };
  });
  return {
    id,
    name,
    cards,
    isFavorite,
    favoriteSetAt: isFavorite ? Date.now() : null,
    createdAt: Date.now(),
    lastUsedAt: null,
  };
}

// ------------------ State ------------------
const state = {
  screen: 'S1',
  scenes: [
    presetScene('preset_morning',  'ルーティン：朝の支度', ['wakeup','change','breakfast','brush_teeth','pack_bag','leave_home']),
    presetScene('preset_bedtime',  'ルーティン：寝る前',   ['take_bath','brush_teeth','pajamas','read_book','sleep']),
    presetScene('preset_outing',   'ルーティン：おでかけ', ['ride_car','ride_train','arrive','goaisatsu','reward']),
    presetScene('demo_baba',       'ばぁばの家までのルート', ['ride_car','ride_train','arrive'], true),
  ],
  // Scene being edited / created
  workingScene: null,   // { id, name, cards: [], isNew: bool }
  // Card being created inside working scene
  draftCard: null,      // { type, label, illustFile?, photoUrl?, clockTime? }
  // Execution state
  runSceneId: null,
  runDoneIds: new Set(),
  // S4a category chip
  illustCategory: 'child',
  // S4c clock time
  clockHour: 8,
  clockMin: 0,
  // UI transient
  pendingDeleteCardIndex: null,
};

// ------------------ DOM helpers ------------------
const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);

function h(tag, attrs = {}, children = []) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') {
      el.addEventListener(k.slice(2).toLowerCase(), v);
    } else if (k === 'dataset') {
      Object.assign(el.dataset, v);
    } else if (v !== null && v !== undefined) {
      el.setAttribute(k, v);
    }
  }
  const add = c => {
    if (c === null || c === undefined || c === false) return;
    if (typeof c === 'string' || typeof c === 'number') el.appendChild(document.createTextNode(c));
    else el.appendChild(c);
  };
  if (Array.isArray(children)) children.forEach(add); else add(children);
  return el;
}
function icon(id, cls = 'icon') {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', cls);
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use.setAttribute('href', `#${id}`);
  svg.appendChild(use);
  return svg;
}

function showToast(msg, duration = 1800) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), duration);
}

function openModal(content) {

  mc.innerHTML = '';

  else mc.appendChild(content);
  mb.classList.add('active');
}
function closeModal() {

}
$('#modalBackdrop').addEventListener('click', (e) => {

// ------------------ Router / rendering ------------------
function go(screen) {
  state.screen = screen;
  render();
}
function render() {
  // tab bar visibility
  const tabbarHidden = (state.screen === 'S6' || state.screen === 'S7');
  $('#tabbar').classList.toggle('hidden', tabbarHidden);

  // tab active state
  $$('#tabbar .tab').forEach(t => t.classList.remove('active'));
  if (state.screen === 'S1') $('#tabbar .tab[data-tab="S1"]').classList.add('active');
  else if (['S2','S3','S4a','S4b','S4c','S4d','S4confirm','S5'].includes(state.screen))
    $('#tabbar .tab[data-tab="S2"]').classList.add('active');
  else if (state.screen === 'S8') $('#tabbar .tab[data-tab="S8"]').classList.add('active');

  const wrap = $('#screenWrap');
  wrap.innerHTML = '';
  const screen = h('div', { class: 'screen active' });

  switch (state.screen) {
    case 'S1': renderS1(screen); break;
    case 'S2': renderS2(screen); break;
    case 'S3': renderS3(screen); break;
    case 'S4a': renderS4a(screen); break;
    case 'S4b': renderS4b(screen); break;
    case 'S4c': renderS4c(screen); break;
    case 'S4d': renderS4d(screen); break;
    case 'S4confirm': renderS4confirm(screen); break;
    case 'S5': renderS5(screen); break;
    case 'S6': renderS6(screen); break;
    case 'S7': renderS7(screen); break;
    case 'S8': renderS8(screen); break;
  }
  wrap.appendChild(screen);
}

// ------------------ Tab bar handler ------------------
$('#tabbar').addEventListener('click', e => {

  const target = tab.dataset.tab;
  if (target === 'S1') {

  } else if (target === 'S2') {

    state.workingScene = { id: 'new_' + Date.now(), name: '', cards: [], isNew: true };
    go('S2');
  } else if (target === 'S8') {

});

function sceneRow(scene) {
  const row = h('div', { class: 'list-row', dataset: { sceneId: scene.id } });

  // star button (お気に入り切り替え — タップで即上位に)
  const starBtn = h('button', {
    type: 'button',
    class: 'star-btn' + (scene.isFavorite ? ' active' : ''),
    'aria-label': scene.isFavorite ? 'お気に入り解除' : 'お気に入りに追加',
  });
  starBtn.appendChild(icon('i-star'));
  const toggleFavorite = (e) => {
    e.preventDefault();
    e.stopPropagation();
    scene.isFavorite = !scene.isFavorite;
    scene.favoriteSetAt = scene.isFavorite ? Date.now() : null;
    // アニメーション後 render
    starBtn.classList.add('pulse');
    setTimeout(() => {
      render();
      showToast(scene.isFavorite ? '★ よく使うに追加しました' : '☆ 通常リストに戻しました');
    }, 120);
  };
  starBtn.addEventListener('click', toggleFavorite);
  starBtn.addEventListener('touchend', toggleFavorite);
  row.appendChild(starBtn);

  row.appendChild(h('span', { class: 'name' }, scene.name));

  // 編集ボタン（鉛筆）— 明示的な編集導線
  const editBtn = h('button', {
    type: 'button',
    class: 'edit-btn',
    'aria-label': 'リストを編集',
  });
  editBtn.appendChild(icon('i-pencil'));
  const openEdit = (e) => {
    e.preventDefault();
    e.stopPropagation();
    state.workingScene = {
      id: scene.id,
      name: scene.name,
      cards: scene.cards.slice(),
      isNew: false,
    };
    go('S5');
  };
  editBtn.addEventListener('click', openEdit);
  editBtn.addEventListener('touchend', openEdit);
  row.appendChild(editBtn);

  const chev = icon('i-chevron-right', 'icon chev');
  row.appendChild(chev);

  // tap → execute
  // long press → edit（バックアップ導線）
  let pressTimer = null;
  let longPressed = false;
  let startY = 0;

  const isExcludedTarget = (e) => {
    const t = e.target;
    return t && t.closest && (t.closest('.star-btn') || t.closest('.edit-btn'));
  };

  const down = (e) => {
    if (isExcludedTarget(e)) return; // star / edit 領域は行タップ対象外
    longPressed = false;
    if (e.touches) startY = e.touches[0].clientY;
    row.classList.add('long-press');
    pressTimer = setTimeout(() => {
      longPressed = true;
      row.classList.remove('long-press');
      navigator.vibrate && navigator.vibrate(20);
      // enter edit mode
      state.workingScene = {
        id: scene.id,
        name: scene.name,
        cards: scene.cards.slice(),
        isNew: false,
      };
      go('S5');
      showToast('リストを編集モードにしました');
    }, 600);
  };
  const up = (e) => {
    clearTimeout(pressTimer);
    row.classList.remove('long-press');
    if (isExcludedTarget(e)) return; // star / edit 領域は行タップ対象外
    if (!longPressed) {
      // normal tap → run
      state.runSceneId = scene.id;
      state.runDoneIds = new Set();
      scene.lastUsedAt = Date.now();
      go('S6');
    }
  };
  const cancel = () => {
    clearTimeout(pressTimer);
    row.classList.remove('long-press');
  };
  row.addEventListener('mousedown', down);
  row.addEventListener('mouseup', up);
  row.addEventListener('mouseleave', cancel);
  row.addEventListener('touchstart', down, { passive: true });
  row.addEventListener('touchend', up);
  row.addEventListener('touchcancel', cancel);
  row.addEventListener('touchmove', (e) => {
    // cancel if user scrolls
    if (Math.abs(e.touches[0].clientY - startY) > 10) cancel();
  }, { passive: true });

  return row;
}

function renderS4c(screen) {
  const header = h('div', { class: 'header' });

  body.appendChild(h('div', { class: 'input-label', style: 'text-align:center; font-weight:600; color:var(--text);' }, '時間を選択してください'));

  const drops = h('div', { class: 'clock-dropdowns' });
  const hourSel = h('select', { class: 'dropdown' });
  for (let i = 0; i < 24; i++) {
    const opt = h('option', { value: i }, `${i}時`);
    if (i === state.clockHour) opt.setAttribute('selected', '');
    hourSel.appendChild(opt);
  }
  const minSel = h('select', { class: 'dropdown' });
  for (let i = 0; i < 60; i += 5) {
    const opt = h('option', { value: i }, `${i}分`);
    if (i === state.clockMin) opt.setAttribute('selected', '');
    minSel.appendChild(opt);
  }
  drops.appendChild(hourSel);
  drops.appendChild(minSel);
  body.appendChild(drops);

  // clock face
  const face = h('div', { class: 'clock-face' });
  const handH = h('div', { class: 'hand-h' });
  const handM = h('div', { class: 'hand-m' });
  const hub = h('div', { class: 'hub' });
  face.appendChild(handH);
  face.appendChild(handM);
  face.appendChild(hub);
  body.appendChild(face);

  function updateHands() {
    const h12 = state.clockHour % 12;
    const hAngle = (h12 * 30) + (state.clockMin * 0.5); // 30deg per hour + 0.5 per min
    const mAngle = state.clockMin * 6;
    handH.style.transform = `rotate(${hAngle}deg)`;
    handM.style.transform = `rotate(${mAngle}deg)`;
  }
  updateHands();
  hourSel.addEventListener('change', () => { state.clockHour = parseInt(hourSel.value, 10); updateHands(); });
  minSel.addEventListener('change', () => { state.clockMin = parseInt(minSel.value, 10); updateHands(); });

  body.appendChild(h('div', { class: 'input-label', style: 'margin-top:20px;' }, 'キャプションを入力（16字まで）'));
  const input = h('input', {
    class: 'input-field',
    type: 'text',
    placeholder: '例：ランドセルをもって しゅっぱつ',
    maxlength: 16,
  });
  const counter = h('div', { class: 'char-counter' }, '0 / 16');
  input.addEventListener('input', () => {
    counter.textContent = `${input.value.length} / 16`;
    cta.classList.toggle('disabled', input.value.trim().length === 0);
  });
  body.appendChild(input);
  body.appendChild(counter);

  screen.appendChild(body);

  const ctaArea = h('div', { class: 'cta-area' });
  const cta = h('div', { class: 'cta disabled' }, ['保存する', icon('i-chevron-right', 'icon')]);
  ctaArea.appendChild(cta);
  screen.appendChild(ctaArea);

  cta.addEventListener('click', () => {
    if (cta.classList.contains('disabled')) return;
    // 時計カードは時刻とキャプションを同一画面で確認済みのため、
    // 確認画面（S4confirm）はスキップして S5 へ直接追加する

    state.draftCard = null;
    showToast('カードを追加しました');

  });

  }, [
    'テキストを変更したい場合は下のフィールドで編集してね。',
    h('br'),
    '変更しない場合は「保存する」を押してください。',
  ]));

  // preview card
  const card = h('div', { class: 'preview-card' + (draft.type === 'photo' ? ' photo-only' : '') });
  const imgArea = h('div', { class: 'preview-img-area' });
  if (draft.type === 'illust') {
    imgArea.appendChild(h('img', { src: ILLUST_BASE + draft.illustFile }));
  } else if (draft.type === 'photo') {
    imgArea.appendChild(h('img', { src: draft.photoUrl }));
  }
  card.appendChild(imgArea);

  // ラベル帯：写真タイプでは省略（画像だけ確認すればよいため）
  let labelArea = null;
  if (draft.type !== 'photo') {
    labelArea = h('div', { class: 'preview-label-area' }, draft.label || '（ラベル未設定）');
    card.appendChild(labelArea);
  }
  body.appendChild(card);

  // editable label
  body.appendChild(h('div', { class: 'input-label', style: 'margin-top: 4px;' }, 'ラベル（16字まで）'));
  const input = h('input', {
    class: 'input-field',
    type: 'text',
    maxlength: 16,
    value: draft.label,
  });
  input.addEventListener('input', () => {
    draft.label = input.value.trim();
    if (labelArea) labelArea.textContent = draft.label || '（ラベル未設定）';
  });
  body.appendChild(input);

  screen.appendChild(body);

  const ctaArea = h('div', { class: 'cta-area' });
  const cta = h('div', { class: 'cta' }, ['保存する', icon('i-chevron-right', 'icon')]);
  ctaArea.appendChild(cta);
  screen.appendChild(ctaArea);

  cta.addEventListener('click', () => {
    if (!draft.label || !draft.label.trim()) {
      showToast('ラベルを入力してください');
      return;
    }
    // add to working scene
    const newCard = {
      id: 'card_' + Date.now(),
      ...draft,
    };
    state.workingScene.cards.push(newCard);
    state.draftCard = null;
    go('S5');
  });
}

// ============================================================
// S5: Edit list
// ============================================================
function renderS5(screen) {
  const header = h('div', { class: 'header' });
  header.appendChild(backButton(() => {
    if (state.workingScene.isNew && state.workingScene.cards.length === 0) {
      // abandon
      state.workingScene = null;
      go('S1');
    } else {
      // confirm discard?
      openDiscardConfirm();
    }
  }));
  header.appendChild(h('span', { class: 'title' }, state.workingScene.name || 'リスト編集'));
  header.appendChild(h('span', { class: 'title-spacer' }));
  screen.appendChild(header);

  const body = h('div', { class: 'body' });

  if (state.workingScene.cards.length === 0) {
    body.appendChild(h('div', {
      class: 'empty-hint',
      style: 'padding: 40px 16px; line-height: 1.7;',
    }, [
      'まだカードがありません。',
      h('br'),
      '下の「＋」ボタンでカードを追加してください。',
    ]));
  } else {
    state.workingScene.cards.forEach((card, idx) => {
      body.appendChild(editRow(card, idx));
    });
  }

  screen.appendChild(body);

  // footer
  const footer = h('div', { class: 'edit-footer' });
  const fabPlus = h('div', { class: 'fab-plus' });
  fabPlus.appendChild(icon('i-plus'));
  fabPlus.addEventListener('click', () => {
    state.draftCard = null;
    go('S3');
  });
  footer.appendChild(fabPlus);

  const disabled = !state.workingScene.name.trim() || state.workingScene.cards.length === 0;
  const save = h('div', { class: 'save-cta' + (disabled ? ' disabled' : '') },
    ['リストを保存する', icon('i-chevron-right', 'icon')]);
  save.addEventListener('click', () => {
    if (disabled) {
      showToast('最低1枚のカードが必要です');
      return;
    }
    saveWorkingScene();
    showToast('リストを保存しました');
    go('S1');
  });
  footer.appendChild(save);
  screen.appendChild(footer);
}

function editRow(card, idx) {
  const row = h('div', { class: 'edit-row', dataset: { idx } });

  const trash = h('span', { class: 'trash' });
  trash.appendChild(icon('i-trash'));
  trash.addEventListener('click', e => {
    e.stopPropagation();
    openDeleteCardConfirm(idx, row);
  });
  row.appendChild(trash);

  const thumb = buildThumbnail(card, 'edit-row');
  row.appendChild(thumb);

  row.appendChild(h('span', { class: 'name' }, card.label));

  const editBtn = h('span', { class: 'edit-icon' });
  editBtn.appendChild(icon('i-pencil', 'icon sm'));
  editBtn.addEventListener('click', e => {
    e.stopPropagation();
    // simple inline label edit via prompt-like modal
    openEditLabel(card, idx);
  });
  row.appendChild(editBtn);

  const handle = h('span', { class: 'handle' });
  handle.appendChild(icon('i-menu', 'icon sm'));
  row.appendChild(handle);

  // Basic drag-to-reorder (up/down by drag)
  attachReorder(row, idx);

  return row;
}

function buildThumbnail(card, containerClass) {
  const thumb = h('span', { class: 'thumb' });
  if (card.type === 'illust') {
    thumb.appendChild(h('img', { src: ILLUST_BASE + card.illustFile, alt: card.label }));
  } else if (card.type === 'photo') {
    thumb.appendChild(h('img', { src: card.photoUrl, alt: card.label }));
  } else if (card.type === 'clock') {
    thumb.classList.add('clock');
    const hh = String(card.clockTime.h).padStart(2, '0');
    const mm = String(card.clockTime.m).padStart(2, '0');
    thumb.textContent = `${hh}:${mm}`;
  } else {
    // text
    thumb.classList.add('text-only');
    thumb.appendChild(icon('i-text'));
  }
  return thumb;
}

function openDeleteCardConfirm(idx, rowEl) {
  const card = state.workingScene.cards[idx];
  const m = h('div');
  m.innerHTML = `
    <div class="modal-title">このカードを削除しますか？</div>
    <div class="modal-body">「<b>${escapeHtml(card.label)}</b>」をリストから外します。</div>
  `;
  const actions = h('div', { class: 'modal-actions' });
  const cancel = h('div', { class: 'modal-btn cancel' }, 'キャンセル');
  cancel.addEventListener('click', closeModal);
  const del = h('div', { class: 'modal-btn confirm' }, '削除');
  del.addEventListener('click', () => {
    closeModal();
    rowEl.classList.add('removing');
    setTimeout(() => {
      state.workingScene.cards.splice(idx, 1);
      render();
    }, 260);
  });
  actions.appendChild(cancel);
  actions.appendChild(del);
  m.appendChild(actions);
  openModal(m);
}

function openEditLabel(card, idx) {
  const m = h('div');
  m.innerHTML = `
    <div class="modal-title">ラベルを編集</div>
    <div class="modal-body">「${escapeHtml(card.label)}」の文字を変更できます（16字まで）。</div>
  `;
  const input = h('input', {
    class: 'input-field',
    type: 'text',
    maxlength: 16,
    value: card.label,
    style: 'margin-bottom:16px;',
  });
  m.appendChild(input);
  const actions = h('div', { class: 'modal-actions' });
  const cancel = h('div', { class: 'modal-btn cancel' }, 'キャンセル');
  cancel.addEventListener('click', closeModal);
  const save = h('div', { class: 'modal-btn confirm primary' }, '保存');
  save.addEventListener('click', () => {
    const v = input.value.trim();
    if (v) {
      card.label = v;
      render();
    }
    closeModal();
  });
  actions.appendChild(cancel);
  actions.appendChild(save);
  m.appendChild(actions);
  openModal(m);
  setTimeout(() => input.focus(), 50);
}

function openDiscardConfirm() {
  const m = h('div');
  m.innerHTML = `
    <div class="modal-title">編集を終了しますか？</div>
    <div class="modal-body">保存されていない変更は失われます。</div>
  `;
  const actions = h('div', { class: 'modal-actions' });
  const cancel = h('div', { class: 'modal-btn cancel' }, '編集を続ける');
  cancel.addEventListener('click', closeModal);
  const discard = h('div', { class: 'modal-btn confirm' }, '破棄する');
  discard.addEventListener('click', () => {
    closeModal();
    state.workingScene = null;
    go('S1');
  });
  actions.appendChild(cancel);
  actions.appendChild(discard);
  m.appendChild(actions);
  openModal(m);
}

function saveWorkingScene() {
  const ws = state.workingScene;
  const existing = state.scenes.find(s => s.id === ws.id);
  if (existing) {
    existing.name = ws.name;
    existing.cards = ws.cards.slice();
    existing.updatedAt = Date.now();
  } else {
    state.scenes.push({
      id: ws.id,
      name: ws.name,
      cards: ws.cards.slice(),
      isFavorite: false,
      createdAt: Date.now(),
      lastUsedAt: null,
    });
  }
  state.workingScene = null;
}

// --- very simple drag-to-reorder ---
let dragState = null;
function attachReorder(rowEl, idx) {
  const handle = rowEl.querySelector('.handle');
  if (!handle) return;

  const onDown = (clientY) => {
    dragState = {
      rowEl, idx,
      startY: clientY,
      moved: 0,
    };
    rowEl.style.transition = 'none';
    rowEl.style.zIndex = '50';
    rowEl.style.boxShadow = '0 6px 14px rgba(0,0,0,0.15)';
  };
  const onMove = (clientY) => {
    if (!dragState) return;
    dragState.moved = clientY - dragState.startY;
    rowEl.style.transform = `translateY(${dragState.moved}px)`;
  };
  const onUp = () => {
    if (!dragState) return;
    const moved = dragState.moved;
    rowEl.style.transition = '';
    rowEl.style.zIndex = '';
    rowEl.style.boxShadow = '';
    rowEl.style.transform = '';
    const itemHeight = rowEl.getBoundingClientRect().height + 8;
    const delta = Math.round(moved / itemHeight);
    const newIdx = Math.min(
      Math.max(0, dragState.idx + delta),
      state.workingScene.cards.length - 1
    );
    if (newIdx !== dragState.idx) {
      const [item] = state.workingScene.cards.splice(dragState.idx, 1);
      state.workingScene.cards.splice(newIdx, 0, item);
      render();
    }
    dragState = null;
  };

  handle.addEventListener('mousedown', e => { e.preventDefault(); onDown(e.clientY); });
  handle.addEventListener('touchstart', e => { onDown(e.touches[0].clientY); }, { passive: true });

  document.addEventListener('mousemove', e => { if (dragState) onMove(e.clientY); });
  document.addEventListener('touchmove', e => { if (dragState) onMove(e.touches[0].clientY); }, { passive: true });

  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchend', onUp);
  document.addEventListener('touchcancel', onUp);
}

// ============================================================
// S6: Execute
// ============================================================
function renderS6(screen) {
  const scene = state.scenes.find(s => s.id === state.runSceneId);
  if (!scene) { go('S1'); return; }

  // Top bar with tap-to-back
  const top = h('div', { class: 'exec-top' });
  const back = backButton(() => {
    state.runSceneId = null;
    state.runDoneIds = new Set();
    go('S1');
  });
  top.appendChild(back);

  top.appendChild(h('div', { class: 'exec-title' }, scene.name));

  const total = scene.cards.length;
  const remaining = scene.cards.filter(c => !state.runDoneIds.has(c.id)).length;
  const doneCount = total - remaining;
  top.appendChild(h('div', { class: 'exec-progress' }, `${doneCount} / ${total}`));
  screen.appendChild(top);


  // body list
  const body = h('div', { class: 'exec-body' });
  const remainingCards = scene.cards.filter(c => !state.runDoneIds.has(c.id));
  remainingCards.forEach(card => {
    const row = h('div', { class: 'exec-row', dataset: { cardId: card.id } });
    row.appendChild(h('span', { class: 'check' }));
    row.appendChild(buildThumbnail(card, 'exec-row'));
    row.appendChild(h('span', { class: 'label' }, card.label));
    row.addEventListener('click', () => {
      if (row.classList.contains('fwap')) return;
      row.classList.add('fwap');
      navigator.vibrate && navigator.vibrate([10, 30, 10]);
      // mark done after animation
      setTimeout(() => {
        state.runDoneIds.add(card.id);
        const leftCount = scene.cards.filter(c => !state.runDoneIds.has(c.id)).length;
        if (leftCount === 0) {
          go('S7');
        } else {
          render();
        }
      }, 350);
    });
    body.appendChild(row);
  });

  if (remainingCards.length === 0) {
    body.appendChild(h('div', { class: 'empty-hint' }, 'すべて完了！'));
  }

  screen.appendChild(body);

  screen.appendChild(h('div', { class: 'exec-hint' }, [
    'タップでふわっと消えるよ',
    icon('i-sparkle', 'icon sm'),
  ]));
}

// ============================================================
// S7: Complete
// ============================================================
function renderS7(screen) {
  const scene = state.scenes.find(s => s.id === state.runSceneId);
  const sceneName = scene ? scene.name : 'リスト';

  const center = h('div', { class: 'complete-center' });

  const confettiLayer = h('div', { class: 'confetti-layer' });
  center.appendChild(confettiLayer);
  launchConfetti(confettiLayer);

  const check = h('div', { class: 'complete-check' });
  check.appendChild(icon('i-check'));
  center.appendChild(check);

  center.appendChild(h('div', { class: 'complete-title' }, 'ぜんぶ できたね！'));

  const sub = h('div', { class: 'complete-sub' }, [
    h('span', { class: 'scene-name' }, sceneName),
    ' を クリア！',
  ]);
  center.appendChild(sub);

  const homeBtn = h('div', { class: 'complete-home-btn' }, 'ホームに もどる');
  homeBtn.addEventListener('click', () => {
    state.runSceneId = null;
    state.runDoneIds = new Set();
    go('S1');
  });
  center.appendChild(homeBtn);

  screen.appendChild(center);
}

function launchConfetti(container) {
  const colors = ['var(--confetti-1)', 'var(--confetti-2)', 'var(--confetti-3)', 'var(--confetti-4)'];
  for (let i = 0; i < 30; i++) {
    const piece = h('div', { class: 'confetti-piece' });
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[i % colors.length];
    piece.style.animationDelay = (Math.random() * 0.5) + 's';
    piece.style.animationDuration = (2 + Math.random() * 1.5) + 's';
    piece.style.width = (6 + Math.random() * 6) + 'px';
    piece.style.height = (10 + Math.random() * 8) + 'px';
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    container.appendChild(piece);
  }
  // cleanup after animation
  setTimeout(() => { container.innerHTML = ''; }, 3500);
}

// ============================================================
// S8: Mypage
// ============================================================
function renderS8(screen) {
  // Apple HIG Large Title
  const lt = h('div', { class: 'large-title' });
  lt.appendChild(h('div', { class: 'brand', style: 'color:var(--text); font-size:30px;' }, 'マイページ'));
  screen.appendChild(lt);

  const body = h('div', { class: 'body' });

  body.appendChild(settingSection('プロフィール', [
    settingRow('i-user', '子どもの名前', 'みとおし', true),
  ]));
  body.appendChild(settingSection('アプリ設定', [
    settingRow('i-bell', '効果音', null, false, { toggle: true, on: true }),
    settingRow('i-diamond', 'プラン', '無料プラン', true),
  ]));
  body.appendChild(settingSection('情報', [
    settingRow('i-doc', 'プライバシーポリシー', null, true),
    settingRow('i-doc', '利用規約', null, true),
    settingRow('i-mail', 'お問い合わせ', null, true),
  ]));

  body.appendChild(h('div', {
    style: 'margin-top: 28px; font-size: 11px; color: var(--text-muted); text-align: center; line-height: 1.8;',
  }, [
    'mitooshi v3.0 プロトタイプ',
    h('br'),
    `保存中のリスト: ${state.scenes.length}件`,
  ]));

  screen.appendChild(body);
}
function settingSection(label, rows) {
  const sec = h('div', { class: 'setting-section' });
  sec.appendChild(h('div', { class: 'setting-section-label' }, label));
  rows.forEach(r => sec.appendChild(r));
  return sec;
}
function settingRow(iconId, label, value, showChev, opts = {}) {
  const row = h('div', { class: 'setting-row' });
  const iw = h('div', { class: 'icon-wrap' });
  iw.appendChild(icon(iconId));
  row.appendChild(iw);
  row.appendChild(h('span', { class: 'name' }, label));
  if (value) row.appendChild(h('span', { class: 'value' }, value));
  if (opts.toggle) {
    const t = h('div', { class: 'toggle' + (opts.on ? '' : ' off') });
    t.addEventListener('click', () => t.classList.toggle('off'));
    row.appendChild(t);
  } else if (showChev) {
    row.appendChild(icon('i-chevron-right', 'icon chev'));
  }
  row.addEventListener('click', () => {
    showToast('プロトタイプでは未実装です');
  });
  return row;
}

// ------------------ Utility helpers ------------------
function backButton(onTap, label = 'もどる') {
  const b = h('button', { class: 'back-btn', type: 'button' });
  b.appendChild(icon('i-chevron-left', 'icon'));
  if (label) b.appendChild(h('span', { class: 'back-label' }, label));
  // Use both click and touchend for reliable mobile behavior
  let fired = false;
  const handler = (e) => {
    if (fired) return;
    fired = true;
    setTimeout(() => { fired = false; }, 400);
    e.preventDefault();
    e.stopPropagation();
    onTap();
  };
  b.addEventListener('click', handler);
  return b;
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;',
  }[c]));
}

// ------------------ Boot ------------------
render();

// Prevent pinch zoom / text select artifacts during drag
document.addEventListener('gesturestart', e => e.preventDefault());
</script>
